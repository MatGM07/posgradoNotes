<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- App principal (oculto hasta autenticar usuario) -->
    <div id="app-container" class="app-container" style="display: none;">

        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">📝 Sistema de Notas</h1>
                <div class="user-info">
                    <span id="user-name" class="user-name"></span>
                    <span id="user-role" class="user-role"></span>
                    <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="main-content">

            <!-- Navegación de Tabs -->
            <nav class="tabs-nav">
                <button class="tab-button active" id="notes-tab-btn" data-tab="notes-tab">
                    Mis Notas
                </button>
                <!-- Visible solo para PROFESOR; el JS lo muestra según el rol -->
                <button class="tab-button" id="create-note-tab" data-tab="create-tab">
                    ➕ Crear Nota
                </button>
                <!-- Visible para PROFESOR y ASISTENTE; el JS lo muestra según el rol -->
                <button class="tab-button" id="users-tab-btn" data-tab="users-tab">
                    👥 Estudiantes
                </button>
            </nav>

            <!-- Tab: Notas -->
            <section id="notes-tab" class="tab-content active">
                <div class="section-header">
                    <h2 id="notes-section-title">Mis Notas</h2>
                    <button id="refresh-notes-btn" class="btn btn-small">🔄 Actualizar</button>
                </div>
                <div id="notes-list" class="notes-grid">
                    <div class="loading">Cargando notas...</div>
                </div>
            </section>

            <!-- Tab: Crear / Editar Nota -->
            <section id="create-tab" class="tab-content">
                <div class="section-header">
                    <h2 id="form-title">Crear Nueva Nota</h2>
                </div>
                <!-- FIX: Eliminado style="display:none" - la visibilidad la gestiona CSS (.tab-content) -->
                <form id="note-form" class="note-form" novalidate>
                    <div class="form-group">
                        <label for="note-title">Título:</label>
                        <input type="text" id="note-title" name="title" required placeholder="Título de la nota">
                    </div>
                    <div class="form-group">
                        <label for="note-content">Contenido:</label>
                        <textarea id="note-content" name="content" rows="6" required
                            placeholder="Escribe el contenido de la nota..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="note-student">Asignar a Estudiante:</label>
                        <select id="note-student" name="student" required>
                            <option value="">Selecciona un estudiante</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="note-grade">Calificación (0 – 100):</label>
                        <input type="number" id="note-grade" name="grade"
                            min="0" max="100" step="0.1" placeholder="Opcional">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar Nota</button>
                        <button type="button" id="cancel-form-btn" class="btn btn-secondary">Cancelar</button>
                    </div>
                </form>
            </section>

            <!-- Tab: Usuarios / Estudiantes -->
            <section id="users-tab" class="tab-content">
                <div class="section-header">
                    <h2 id="users-section-title">Estudiantes Registrados</h2>
                </div>
                <!-- FIX: Eliminado style="display:none" - la visibilidad la gestiona CSS (.tab-content) -->
                <div id="users-list" class="students-table">
                    <div class="loading">Cargando datos...</div>
                </div>
            </section>

        </main>
    </div><!-- /#app-container -->

    <!-- Modal: Detalle de Nota -->
    <div id="note-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-note-title">Título de la Nota</h2>
                <!-- FIX: Clase .modal-close manejada en JS con querySelectorAll -->
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-note-content"></p>
                <!-- FIX: Renombrado a .modal-note-meta para no colisionar con .note-card-meta del CSS -->
                <div class="modal-note-meta">
                    <p><strong>Estudiante:</strong> <span id="modal-note-student"></span></p>
                    <p><strong>Calificación:</strong> <span id="modal-note-grade">-</span></p>
                    <p><strong>Fecha:</strong> <span id="modal-note-date"></span></p>
                </div>
            </div>
            <div class="modal-footer">
                <!-- Visibles solo si el usuario es PROFESOR; el JS los controla -->
                <button id="modal-edit-btn" class="btn btn-primary">Editar</button>
                <button id="modal-delete-btn" class="btn btn-danger">Eliminar</button>
                <button class="btn btn-secondary modal-close-btn">Cerrar</button>
            </div>
        </div>
    </div><!-- /#note-modal -->

    <script src="js/app.js"></script>
</body>
</html>
