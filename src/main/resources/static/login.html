<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Notes Service</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #1f2937; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; color: #4b5563; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        .error { color: #dc2626; font-size: 0.85rem; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Iniciar Sesión</h2>
    <!-- Este action="/login" debe coincidir con tu loginProcessingUrl en SecurityConfig -->
    <form action="/login" method="POST">
        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Entrar</button>
    </form>

    <!-- Manejo de errores visuales (cuando falla el login) -->
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            document.write('<div class="error">Usuario o contraseña incorrectos.</div>');
        }
    </script>
</div>

</body>
</html>
