server.port=8080
spring.application.name=notes-service

# ─── Misma base de datos que admin-service ──────────────────────────────────
# notes-service COMPARTE la BD pero NO la crea.
# Si admin-service no corrió primero, la tabla 'users' no existirá.
spring.datasource.url=jdbc:mysql://localhost:3306/academia_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
# 'update' crea la tabla 'notes' si no existe, pero NO toca la tabla 'users'
# (ya gestionada por admin-service con sus propias entidades).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Establece el tiempo máximo de inactividad (ej. 15 minutos)
server.servlet.session.timeout=1m